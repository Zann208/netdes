name: Export current NETDES

on:
  push:
    paths:
      - '.github/workflows/export-current.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build archive
        run: |
          zip -r netdes-current.zip . -x '.git/*' '.github/workflows/export-current.yml'
      - uses: actions/upload-artifact@v4
        with:
          name: netdes-current-main
          path: netdes-current.zip
          retention-days: 1
