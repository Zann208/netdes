name: Apply independent UI
on:
  push:
    paths:
      - '.github/workflows/apply-independent-ui.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add UI script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); tag='<script src="./independent-console-ui.js?v=20260825c"></script>'
          if tag not in s: s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply independent console UI" || exit 0
          git push
