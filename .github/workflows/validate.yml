name: Validate NETDES

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "study-console-adapter.css"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - "DEPLOY.md"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "index.html"
      - "study-console-adapter.css"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - "DEPLOY.md"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate console
        run: node scripts/validate.mjs
