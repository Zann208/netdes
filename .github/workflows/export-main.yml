name: Export NETDES main

on:
  push:
    paths:
      - '.github/workflows/export-main.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package builder handoff
        run: |
          zip -r netdes-main.zip . -x '.git/*' '.github/workflows/export-main.yml'
      - name: Upload builder handoff
        uses: actions/upload-artifact@v4
        with:
          name: netdes-main-builder
          path: netdes-main.zip
          retention-days: 1
